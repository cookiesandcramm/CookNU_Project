
server {
    listen 80;
    server_name _;

    # ---- API routes: one path prefix per backend module -----------------------
    # proxy_pass without a URI part forwards the request path unchanged, e.g.
    # /api/recipes/123 reaches recipe-service as /api/recipes/123.
    location /api/auth {
        proxy_pass http://auth-service:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/recipes {
        proxy_pass http://recipe-service:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/notifications {
        proxy_pass http://notification-service:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Anything else under /api/ is not a known module.
    location /api/ {
        default_type application/json;
        return 404 '{"error":"Not found"}';
    }

    # ---- Website -----------------------------------------------------------------
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
